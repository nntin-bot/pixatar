name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the package bakes the pinned Pixel Agents wardrobe and bundles its renderer
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # what `npm publish` would ship, so a packaging slip shows on the PR
      - run: npm pack --dry-run --workspace packages/pixatar
